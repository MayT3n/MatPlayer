<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <!-- جلوگیری از تیره‌تر کردن صفحه توسط افزونه Dark Reader -->
    <meta name="darkreader-lock" />
    <title>Mat Player — پخش موسیقی</title>

    <!-- PWA: قابل نصب روی صفحه‌ی اصلی موبایل -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mat Player" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=optional"
      rel="stylesheet"
    />

      :root {
        --font-fa: "Vazirmatn", system-ui, sans-serif;
        /* فونت نرم و اپل‌گونه برای کلمات خارجی */
        --font-en: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Segoe UI", sans-serif;
      }
      [dir="ltr"],
      .font-en {
        font-family: var(--font-en);
      }
      /* پس‌زمینه‌ی پایه — مقاوم در برابر Dark Reader */
      html {
        background: #0a0a0c !important;
      }
    </style>
