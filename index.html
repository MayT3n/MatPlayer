<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <!-- جلوگیری از تیره‌تر کردن صفحه توسط افزونه Dark Reader -->
    <meta name="darkreader-lock" />
    <title>Mat Player — پخش موسیقی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-fa: "Vazirmatn", system-ui, sans-serif;
        /* فونت نرم و اپل‌گونه برای کلمات خارجی */
        --font-en: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Segoe UI", sans-serif;
      }
      [dir="ltr"],
      .font-en {
        font-family: var(--font-en);
      }
      /* پس‌زمینه‌ی پایه — مقاوم در برابر Dark Reader */
      html {
        background: #0a0a0c !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
